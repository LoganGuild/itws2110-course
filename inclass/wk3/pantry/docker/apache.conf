# Apache's configuration for Pantry. Replaces Ubuntu's default site.
#
# Homework 1 used the same server (php:8.3-apache) and served .php files
# directly. Pantry has one difference: every URL is answered by one file.
# FallbackResource does that -- "if the requested file does not exist under
# DocumentRoot, run /index.php instead." That is the whole front controller.

ServerName localhost

# Let the PANTRY_DB environment variable through to PHP. Without this Apache
# starts each request with a clean environment and getenv() would see nothing.
PassEnv PANTRY_DB

<VirtualHost *:80>
    DocumentRoot /app/public

    <Directory /app/public>
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Send logs to the container's output so `docker compose logs web` shows them.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
